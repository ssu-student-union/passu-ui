name: ✨ 기능 제안
description: 새로운 기능이나 개선 사항을 제안합니다.
labels:
  - type:feat
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 어떤 문제나 필요성 때문에 이 제안을 하게 되었나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 기능/변경을 원하는지 구체적으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
    validations:
      required: false

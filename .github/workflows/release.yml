name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Create a release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          title: "chore: 패키지 버전 업데이트"
          commit: "chore: 패키지 버전 업데이트"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish to GitHub Packages
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "$name@$version은 이미 배포되어 있습니다."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm publish --no-git-checks
          tag="v$version"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$version" --generate-notes --verify-tag
          {
            echo "published=true"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # 새 버전이 실제로 배포됐을 때만 Discord로 알립니다. 웹훅 URL은 조직 시크릿이라 다른 레포에서도 같은 값으로 쓸 수 있습니다.
      - name: Discord 알림
        if: steps.publish.outputs.published == 'true'
        run: |
          jq -n \
            --arg title "$NAME@$VERSION 배포" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{embeds: [{title: $title, url: $url, description: $repo, color: 5763719}]}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ steps.publish.outputs.name }}
          VERSION: ${{ steps.publish.outputs.version }}

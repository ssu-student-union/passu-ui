name: 배포

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing(OIDC)과 provenance 생성에 필요합니다.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml에 고정된 Node·pnpm 버전을 그대로 사용합니다.
      - uses: jdx/mise-action@v2

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 미반영 changeset이 있으면 "버전 업데이트" PR을 열고,
      # 그 PR이 머지되어 새 버전이 main에 올라오면 npm에 배포합니다.
      - name: 버전 PR 생성 또는 npm 배포
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: "chore: 패키지 버전 업데이트"
          commit: "chore: 패키지 버전 업데이트"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

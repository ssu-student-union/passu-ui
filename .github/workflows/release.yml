name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 릴리스 PR·태그·Release를 GitHub Actions 기본 봇이 아닌 전용 GitHub App(릴리스 봇)으로 만듭니다.
      # App 토큰으로 만든 PR은 CI 워크플로도 트리거합니다. (GITHUB_TOKEN으로 만든 PR은 트리거하지 않습니다)
      # client-id와 private-key는 조직 레벨 변수·시크릿이라 다른 레포에서도 같은 값으로 쓸 수 있습니다.
      - name: 릴리스 봇 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      # mise.toml에 고정된 Node·pnpm 버전을 그대로 사용합니다.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # 미반영 changeset이 있으면 "버전 업데이트" PR을 엽니다.
      - name: Create a release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          title: "chore: 패키지 버전 업데이트"
          commit: "chore: 패키지 버전 업데이트"
          # git push 대신 GitHub API로 커밋해 봇이 작성자인 서명된(Verified) 커밋을 만듭니다.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # 버전 업데이트 PR이 머지되어 새 버전이 main에 올라오면 GitHub Packages에 배포하고 v{버전} 태그와 GitHub Release를 만듭니다.
      # changesets/action의 publish는 CLI 출력의 "New tag:"로 릴리스를 판단하는데,
      # 현재 CLI는 "Created git tags:"로 출력해 동작하지 않으므로 직접 배포합니다.
      # 이미 배포된 버전이면 아무것도 하지 않으므로 일반 머지에서도 안전합니다.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "$name@$version은 이미 배포되어 있습니다."
            exit 0
          fi
          pnpm publish --no-git-checks
          tag="v$version"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$version" --generate-notes --verify-tag
        env:
          # GitHub Packages 배포는 App 토큰으로 인증할 수 없어 워크플로의 GITHUB_TOKEN을 씁니다.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

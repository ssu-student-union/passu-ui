name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # mise.toml에 고정된 Node·pnpm 버전을 그대로 사용합니다.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # 미반영 changeset이 있으면 "버전 업데이트" PR을 엽니다.
      - name: Create a release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          title: "chore: 패키지 버전 업데이트"
          commit: "chore: 패키지 버전 업데이트"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 버전 업데이트 PR이 머지되어 새 버전이 main에 올라오면 npm에 배포하고 v{버전} 태그와 GitHub Release를 만듭니다.
      # changesets/action의 publish는 CLI 출력의 "New tag:"로 릴리스를 판단하는데,
      # 현재 CLI는 "Created git tags:"로 출력해 동작하지 않으므로 직접 배포합니다.
      # 이미 배포된 버전이면 아무것도 하지 않으므로 일반 머지에서도 안전합니다.
      # 토큰 없이 npm Trusted Publisher(OIDC)로 인증합니다. npm 패키지 설정에 이 레포·워크플로가 등록되어 있어야 합니다.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version은 이미 배포되어 있습니다."
            exit 0
          fi
          pnpm publish --no-git-checks
          tag="v$version"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$version" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

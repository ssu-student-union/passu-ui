name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 시크릿이 등록되기 전에는 빌드와 배포를 건너뛰어 main이 빨갛게 되지 않도록 합니다.
      - name: Check Cloudflare credentials
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 Storybook 배포를 건너뜁니다."
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm run build-storybook

      # wrangler.jsonc의 assets.directory(storybook-static)를 Workers에 배포합니다.
      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

name: PR 제목 검사

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # PR 제목이 CONVENTION.md의 커밋 컨벤션(Conventional Commits 타입 프리픽스 + 한글 설명)을 따르는지 검사합니다.
      - name: PR 제목 형식 검사
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.trim();

            if (!title) {
              core.setFailed("PR 제목이 비어 있습니다.");
              return;
            }

            const conventionalPattern = /^[a-z]+(\([^)]*\))?!?:\s.+/;
            if (!conventionalPattern.test(title)) {
              core.setFailed(
                "PR 제목은 `type: 설명` 형식(예: feat: 로그인 기능 추가)이어야 합니다."
              );
            }

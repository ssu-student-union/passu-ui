pre-commit:
  parallel: false
  commands:
    biome-check:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck

commit-msg:
  commands:
    commit-message-format:
      run: |
        head -1 "{1}" | grep -qE '^[a-z]+(\([^)]*\))?!?: .+' || {
          echo "커밋 메시지는 'type: 설명' 형식이어야 합니다 (예: feat: 로그인 기능 추가)"
          exit 1
        }
